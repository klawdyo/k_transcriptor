[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k-transcriptor"
version = "0.1.0"
description = "Search YouTube, download audio and transcribe it locally with Whisper (GPU if available), through one shared queue with a live terminal view."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # the core uses only the standard library; the heavy parts are extras

[project.optional-dependencies]
captions = ["youtube-transcript-api"]
transcribe = ["yt-dlp", "faster-whisper"]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
all = ["youtube-transcript-api", "yt-dlp", "faster-whisper", "nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
dev = ["pytest"]

[project.scripts]
ktr = "k_transcriptor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
